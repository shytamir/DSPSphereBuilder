name: Build Thunderstore package
run-name: Build ${{ github.run_number }} from ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the pinned SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Compile production source and check metadata
        run: |
          ./scripts/Build-Plugin.ps1 -BuildNumber $env:GITHUB_RUN_NUMBER -Commit $env:GITHUB_SHA -RunAttempt $env:GITHUB_RUN_ATTEMPT

      - name: Set up geometry check runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'

      - name: Check the compiled plan
        run: |
          dotnet run --project checks/Logic/Logic.csproj -c Release -- artifacts/compiled-plan.json
          if ($LASTEXITCODE -ne 0) { throw 'Production logic checks failed.' }
          python -B scripts/check_plan.py artifacts/compiled-plan.json
          if ($LASTEXITCODE -ne 0) { throw 'Compiled plan comparison failed.' }

      - name: Build and validate executable package
        id: package
        run: |
          ./scripts/Build-Package.ps1 -BuildNumber $env:GITHUB_RUN_NUMBER -Commit $env:GITHUB_SHA -RunAttempt $env:GITHUB_RUN_ATTEMPT

      - name: Upload package and build identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: DSPSphereBuilder-${{ steps.package.outputs.build_label }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/packages/DSPSphereBuilder-${{ steps.package.outputs.package_version }}.zip
            artifacts/BUILD-INFO.json
          if-no-files-found: error

      - name: Summarize artifact
        run: |
          $info = Get-Content artifacts/BUILD-INFO.json -Raw | ConvertFrom-Json
          @"
          Executable package: $($info.package_file)

          Thunderstore version: $($info.package_version)

          Build identity: $($info.build_label)

          Extract the inner package ZIP from this Actions artifact. It contains the production DLL and source/licenses.
          "@ >> $env:GITHUB_STEP_SUMMARY
